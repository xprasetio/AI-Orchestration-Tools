name: CI and Deploy to tools.gestudio.my.id

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-tools
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Validate Docker Compose
        run: docker compose config --no-interpolate > /dev/null

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: production
      url: https://tools.gestudio.my.id
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            cd /opt/apps/AI-Orchestration-Tools
            git fetch origin main
            git checkout --force main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps --status running ai-orchestration-tools
            curl --fail --silent --show-error --resolve tools.gestudio.my.id:443:127.0.0.1 https://tools.gestudio.my.id/ > /dev/null
