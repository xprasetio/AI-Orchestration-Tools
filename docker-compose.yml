services:
  ai-orchestration-tools:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestration-tools:local
    container_name: ai-orchestration-tools
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.ai-orchestration-tools.rule=Host(`${AI_TOOLS_DOMAIN:?Set AI_TOOLS_DOMAIN in .env}`)"
      - "traefik.http.routers.ai-orchestration-tools.entrypoints=websecure"
      - "traefik.http.routers.ai-orchestration-tools.tls=true"
      - "traefik.http.routers.ai-orchestration-tools.tls.certresolver=myresolver"
      - "traefik.http.routers.ai-orchestration-tools.service=ai-orchestration-tools"
      - "traefik.http.routers.ai-orchestration-tools-http.rule=Host(`${AI_TOOLS_DOMAIN:?Set AI_TOOLS_DOMAIN in .env}`)"
      - "traefik.http.routers.ai-orchestration-tools-http.entrypoints=web"
      - "traefik.http.routers.ai-orchestration-tools-http.middlewares=ai-orchestration-tools-redirect"
      - "traefik.http.middlewares.ai-orchestration-tools-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.ai-orchestration-tools.loadbalancer.server.port=80"

networks:
  frontend:
    external: true
